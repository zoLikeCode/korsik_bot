worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # Re-resolve Compose services after a container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    client_max_body_size 52m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        set $api_backend http://api:8000;
        set $max_backend http://max-connector:8001;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://st.max.ru; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://max.ru https://*.max.ru https://oneme.ru https://*.oneme.ru" always;
        location = /api/v1/integrations/max/webhook {
            proxy_pass $max_backend/hooks/max$is_args$args;
            proxy_read_timeout 40s;
            proxy_set_header Host $http_host;
            client_max_body_size 1m;
        }
        location = /hooks/max {
            proxy_pass $max_backend/hooks/max$is_args$args;
            proxy_read_timeout 40s;
            proxy_set_header Host $http_host;
            client_max_body_size 1m;
        }
        location /internal/ { return 404; }
        location /api/ {
            proxy_pass $api_backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_buffering off;
        }
        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
